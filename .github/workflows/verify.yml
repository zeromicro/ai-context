name: Verify context

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_docs.py --online

  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - run: go install github.com/zeromicro/go-zero/tools/goctl@v1.9.2
      - run: python3 scripts/verify_patterns.py
